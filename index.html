    ed.innerHTML = html;
  }

  function updateReadonlyUI() {
    var editBtn = document.getElementById('editBtn');
    var copyBtn = document.getElementById('copyBtn');
    var banner = document.getElementById('readonlyBanner');
    var saveHint = document.getElementById('saveHint');
    var editorEl = document.getElementById('editor');
    var projectBar = document.getElementById('projectBar');

    if (isReadonly) {
      if (editBtn) editBtn.style.display = 'none';
      if (copyBtn) copyBtn.style.display = 'inline-flex';
      if (banner) banner.classList.add('show');
      if (saveHint) saveHint.textContent = '只读模式：内容不会被修改';
      if (editorEl) editorEl.classList.remove('open');
      if (projectBar) projectBar.style.display = 'none';
      var rtxt = document.getElementById('readonlyText');
      if (rtxt) {
        rtxt.innerHTML = '<b>只读模式</b>：这是发布者分享的项目「' +
          esc(state ? state.name : '') + '」，你看到的是其最新版本，无法修改。';
      }
    } else {
      if (editBtn) editBtn.style.display = '';
      if (copyBtn) copyBtn.style.display = 'none';
      if (banner) banner.classList.remove('show');
      if (saveHint) saveHint.textContent = '修改会自动保存在本机浏览器中';
      if (projectBar) projectBar.style.display = '';
    }
  }

  function copyAsMine() {
    if (!isReadonly) return;
    if (!window.confirm('将这份项目复制为你自己的项目？复制后你可以自由编辑，原分享版本不受影响。')) return;
    isReadonly = false;
    state.id = newId('p_');
    state.name = (state.name || '复制自分享') + '（副本）';
    db.projects.push(state);
    db.currentProjectId = state.id;
    saveDb();
    try {
      var clean = window.location.href.split('#')[0].split('?')[0];
      window.history.replaceState(null, '', clean);
    } catch (e) {}
    updateReadonlyUI();
    renderProjectSelect();
    renderEditor();
    renderGantt();
    renderTitle();
    flashSaved('✓ 已复制为你的项目，现在可以编辑了');
  }

  function normalize() {
    if (!state) return;
    if (!Array.isArray(state.tasks)) state.tasks = [];
    state.tasks.forEach(function (t) {
      if (typeof t.link !== 'string') t.link = '';
      if (t.end < t.start) t.end = new Date(t.start.getTime());
      t.progress = normalizeProgress(t.progress);
      t.riskLevel = normalizeRiskLevel(t.riskLevel);
      if (typeof t.riskNote !== 'string') t.riskNote = '';
      if (!Array.isArray(t.progressLogs)) t.progressLogs = [];
      t.progressLogs.forEach(function (l) {
        if (!l.id) l.id = newId('lg_');
        var ld = parseDate(l.date);
        if (!isValidDate(ld)) l.date = toDay(new Date());
        if (typeof l.text !== 'string') l.text = '';
      });
    });
    if (state.projectEnd < state.projectStart) {
      state.projectEnd = new Date(state.projectStart.getTime());
    }
    if (typeof state.name !== 'string') state.name = '未命名项目';
    if (typeof state.goal !== 'string') state.goal = '';
    state.tasks.sort(function (a, b) {
      var sa = a.start.getTime(), sb = b.start.getTime();
      if (sa !== sb) return sa - sb;
      var ea = a.end.getTime(), eb = b.end.getTime();
      if (ea !== eb) return ea - eb;
      return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN');
    });
  }

  function renderAll() {
    renderProjectSelect();
    renderEditor();
    renderGantt();
  }

  function findTask(id) {
    if (!state) return null;
    var t = null;
    state.tasks.forEach(function (x) { if (x.id === id) t = x; });
    return t;
  }

  function updateLinkUI(tid) {
    var t = findTask(tid);
    if (!t) return;
    var rawLink = t.link || '';
    var okLink = normalizeLink(rawLink);
    var stateEl = document.querySelector('.ed-link-state[data-state-for="' + tid + '"]');
    if (stateEl) {
      if (!rawLink.trim()) { stateEl.className = 'ed-link-state'; stateEl.textContent = ''; }
      else if (okLink) { stateEl.className = 'ed-link-state ok'; stateEl.textContent = '✓ 可跳转'; }
      else { stateEl.className = 'ed-link-state warn'; stateEl.textContent = '! 无效链接'; }
    }
    var openEl = document.querySelector('.ed-link-open[data-open-for="' + tid + '"]');
    if (openEl) {
      if (okLink) { openEl.classList.remove('disabled'); openEl.href = okLink; }
      else { openEl.classList.add('disabled'); openEl.href = '#'; }
    }
  }

  function syncProgressUI(tid) {
    var t = findTask(tid);
    if (!t) return;
    var val = (t.progress === null || t.progress === undefined) ? '' : t.progress;
    var rangeEl = document.querySelector('input[type=range][data-k="progress"][data-tid="' + tid + '"]');
    var numEl = document.querySelector('input[type=number][data-k="progress"][data-tid="' + tid + '"]');
    if (rangeEl) { rangeEl.value = (val === '') ? 0 : val; rangeEl.style.setProperty('--p', (val === '' ? 0 : val) + '%'); }
    if (numEl) numEl.value = val;
  }

  function onEditorInput(ev) {
    if (isReadonly) return;
    var el = ev.target;
    if (!el || !el.dataset) return;
    var k = el.dataset.k;
    if (k === 'name' && !el.dataset.tid) {
      state.name = el.value;
      renderTitle();
      renderProjectSelect();
      saveDb(); flashSaved();
      return;
    }
    if (k === 'goal' && !el.dataset.tid) {
      state.goal = el.value;
      var goalTextEl = document.getElementById('goalText');
      var goalWrap = document.getElementById('goalWrap');
      if (goalTextEl) goalTextEl.textContent = el.value;
      if (goalWrap) goalWrap.classList.toggle('empty', !el.value.trim());
      saveDb(); flashSaved();
      return;
    }
    var tid = el.dataset.tid;
    if (!tid) return;
    var t = findTask(tid);
    if (!t) return;
    if (k === 'logText') {
      var logId = el.dataset.logId;
      if (!logId || !t.progressLogs) return;
      var log = null;
      t.progressLogs.forEach(function (x) { if (x.id === logId) log = x; });
      if (!log) return;
      log.text = el.value;
      saveDb(); renderGantt(); flashSaved();
      return;
    }
    if (k === 'progress' && el.type === 'range') {
      var v = clamp(parseInt(el.value, 10) || 0, 0, 100);
      t.progress = v;
      el.style.setProperty('--p', v + '%');
      var numEl = document.querySelector('input[type=number][data-k="progress"][data-tid="' + tid + '"]');
      if (numEl) numEl.value = v;
      saveDb(); renderGantt(); flashSaved();
      return;
    }
    if (k === 'progress' && el.type === 'number') {
      var raw = el.value.trim();
      if (raw === '') t.progress = null;
      else {
        var n = parseInt(raw, 10);
        if (isNaN(n)) return;
        n = clamp(n, 0, 100);
        t.progress = n;
        el.value = n;
      }
      var rangeEl = document.querySelector('input[type=range][data-k="progress"][data-tid="' + tid + '"]');
      if (rangeEl) {
        rangeEl.value = (t.progress === null) ? 0 : t.progress;
        rangeEl.style.setProperty('--p', (t.progress === null ? 0 : t.progress) + '%');
      }
      saveDb(); renderGantt(); flashSaved();
      return;
    }
    if (k !== 'name' && k !== 'desc' && k !== 'deliverable' && k !== 'link' && k !== 'riskNote') return;
    t[k] = el.value;
    if (k === 'link') updateLinkUI(tid);
    saveDb(); renderGantt(); flashSaved();
  }

  function onEditorChange(ev) {
    if (isReadonly) return;
    var el = ev.target;
    if (!el || !el.dataset || !el.dataset.k) return;
    var key = el.dataset.k;
    if (key === 'logDate') {
      var tidLog = el.dataset.tid, logId = el.dataset.logId;
      if (!tidLog || !logId) return;
      var tLog = findTask(tidLog);
      if (!tLog || !tLog.progressLogs) return;
      var log = null;
      tLog.progressLogs.forEach(function (x) { if (x.id === logId) log = x; });
      if (!log) return;
      var ld = parseDate(el.value);
      if (!isValidDate(ld)) return;
      log.date = ld;
      saveDb(); renderGantt(); renderEditor(); flashSaved();
      return;
    }
    if (key === 'name' || key === 'goal' || key === 'desc' ||
        key === 'deliverable' || key === 'link' || key === 'riskNote' || key === 'logText') return;
    if (key === 'progress') {
      var tid2 = el.dataset.tid;
      if (!tid2) return;
      var t2 = findTask(tid2);
      if (!t2) return;
      var raw2 = el.value.trim();
      if (raw2 === '') t2.progress = null;
      else {
        var n2 = parseInt(raw2, 10);
        if (isNaN(n2)) return;
        n2 = clamp(n2, 0, 100);
        t2.progress = n2;
        el.value = n2;
      }
      syncProgressUI(tid2);
      saveDb(); renderGantt(); flashSaved();
      return;
    }
    if (el.dataset.tid) {
      var target = findTask(el.dataset.tid);
      if (!target) return;
      var d = parseDate(el.value);
      if (!isValidDate(d)) return;
      if (key === 'start') {
        target.start = d;
        if (target.end < target.start) target.end = new Date(d.getTime());
      } else {
        target.end = d;
        if (target.end < target.start) target.start = new Date(d.getTime());
      }
    } else {
      if (key === 'pStart') {
        var v1 = parseDate(el.value);
        if (!isValidDate(v1)) return;
        state.projectStart = v1;
        if (state.projectEnd < state.projectStart) state.projectEnd = new Date(v1.getTime());
      } else if (key === 'pEnd') {
        var v2 = parseDate(el.value);
        if (!isValidDate(v2)) return;
        state.projectEnd = v2;
        if (state.projectEnd < state.projectStart) state.projectStart = new Date(v2.getTime());
      } else if (key === 'pDeadline') {
        var v3 = parseDT(el.value);
        if (!isValidDate(v3)) return;
        state.deadline = v3;
      }
    }
    normalize();
    saveDb(); renderGantt(); renderEditor(); flashSaved();
  }

  function onEditorClick(ev) {
    if (isReadonly) return;
    var el = ev.target;
    if (!el || !el.dataset) return;
    if (el.id === 'shiftApply') { applyShift(); return; }
    if (el.id === 'addTask') { addTask(); return; }
    var act = el.dataset.act;
    var taskId = el.dataset.tid;

    if (act === 'add-log' && taskId) {
      var tAdd = findTask(taskId);
      if (!tAdd) return;
      if (!Array.isArray(tAdd.progressLogs)) tAdd.progressLogs = [];
      var newLog = { id: newId('lg_'), date: toDay(new Date()), text: '' };
      tAdd.progressLogs.push(newLog);
      saveDb(); renderEditor(); renderGantt(); flashSaved('已添加一条进展记录');
      setTimeout(function () {
        var input = document.querySelector('input[data-log-id="' + newLog.id + '"][data-k="logText"]');
        if (input) { input.focus(); input.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }, 60);
      return;
    }
    if (act === 'del-log' && taskId) {
      var logId2 = el.dataset.logId;
      var tDel = findTask(taskId);
      if (!tDel || !tDel.progressLogs) return;
      var idx = -1;
      tDel.progressLogs.forEach(function (x, i) { if (x.id === logId2) idx = i; });
      if (idx < 0) return;
      tDel.progressLogs.splice(idx, 1);
      saveDb(); renderEditor(); renderGantt(); flashSaved('已删除该进展记录');
      return;
    }
    if (el.classList && el.classList.contains('risk-btn')) {
      var tid = el.dataset.tid || (el.parentElement && el.parentElement.dataset.tid);
      var lv = el.dataset.risk;
      if (!tid || !lv) return;
      var t = findTask(tid);
      if (!t) return;
      t.riskLevel = normalizeRiskLevel(lv);
      var btns = el.parentElement.querySelectorAll('.risk-btn');
      Array.prototype.forEach.call(btns, function (b) {
        b.classList.toggle('active', b.dataset.risk === t.riskLevel);
      });
      var card = document.querySelector('.ed-task[data-card-id="' + tid + '"]');
      if (card) {
        card.classList.remove('has-risk-high', 'has-risk-medium');
        if (t.riskLevel === 'high') card.classList.add('has-risk-high');
        else if (t.riskLevel === 'medium') card.classList.add('has-risk-medium');
      }
      saveDb(); renderGantt(); flashSaved('风险等级：' + RISK_META[t.riskLevel].label);
      return;
    }
    if (el.classList && el.classList.contains('ed-link-open')) {
      if (el.classList.contains('disabled')) ev.preventDefault();
      return;
    }
    if (act === 'del' && taskId) handleTaskAction(act, taskId);
  }

  function handleTaskAction(act, id) {
    if (isReadonly) return;
    var idx = -1;
    state.tasks.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx < 0) return;
    var t = state.tasks[idx];
    if (act === 'del') {
      var label = t.name || '未命名任务';
      if (!window.confirm('确定删除「' + label + '」吗？')) return;
      state.tasks.splice(idx, 1);
      flashSaved('已删除「' + label + '」');
    }
    normalize();
    saveDb(); renderEditor(); renderGantt();
  }

  function addTask() {
    if (isReadonly) return;
    var today = toDay(new Date());
    var s, e;
    if (state.tasks.length > 0) {
      var last = state.tasks[state.tasks.length - 1];
      s = addDays(last.end, 1);
    } else {
      s = new Date(Math.max(today.getTime(), toDay(state.projectStart).getTime()));
    }
    e = addDays(s, 6);
    var newTask = {
      id: newId('t_'), name: '新工作事项', desc: '',
      deliverable: '', link: '',
      progress: null, riskLevel: 'none', riskNote: '',
      progressLogs: [],
      start: s, end: e
    };
    state.tasks.push(newTask);
    normalize();
    saveDb(); renderEditor(); renderGantt(); flashSaved('已添加新工作事项');
    setTimeout(function () {
      var card = document.querySelector('.ed-task[data-card-id="' + newTask.id + '"]');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('flash');
        setTimeout(function () { card.classList.remove('flash'); }, 1600);
        var nameInput = card.querySelector('.ed-inp.name');
        if (nameInput) { nameInput.focus(); nameInput.select(); }
      }
    }, 60);
  }

  function applyShift() {
    if (isReadonly) return;
    var el = document.getElementById('shiftDays');
    if (!el) return;
    var n = parseInt(el.value, 10);
    if (isNaN(n) || n === 0) { flashSaved('请输入非 0 的天数'); return; }
    state.projectStart = addDays(state.projectStart, n);
    state.projectEnd = addDays(state.projectEnd, n);
    state.deadline = addDays(state.deadline, n);
    state.tasks.forEach(function (t) {
      t.start = addDays(t.start, n);
      t.end = addDays(t.end, n);
    });
    el.value = 0;
    normalize();
    saveDb(); renderGantt(); renderEditor();
    flashSaved('已整体' + (n > 0 ? '推迟' : '提前') + Math.abs(n) + '天');
  }

  var hintTimer = null;
  function flashSaved(msg) {
    var el = document.getElementById('saveHint');
    if (!el) return;
    el.textContent = msg || '✓ 已保存到本机浏览器';
    el.style.color = '#10b981';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      el.textContent = isReadonly ? '只读模式：内容不会被修改' : '修改会自动保存在本机浏览器中';
      el.style.color = '#94a3b8';
    }, 2200);
  }

  var shareModal = document.getElementById('shareModal');
  var shareUrlEl = document.getElementById('shareUrl');
  var shareLenEl = document.getElementById('shareLen');
  var shareCopyHint = document.getElementById('shareCopyHint');

  function openShareModal() {
    if (!state) return;
    var url = generateShareUrl();
    shareUrlEl.value = url;
    var len = url.length;
    shareLenEl.className = 'saved';
    shareLenEl.textContent = '已压缩：' + len + ' 字符';
    shareCopyHint.textContent = '';
    shareCopyHint.className = '';
    shareModal.classList.add('open');
    setTimeout(function () {
      try { shareUrlEl.focus(); shareUrlEl.select(); } catch (e) {}
    }, 80);
  }
  function closeShareModal() { shareModal.classList.remove('open'); }
  function copyShareUrl() {
    var text = shareUrlEl.value;
    if (!text) return;
    function done() {
      shareCopyHint.textContent = '✓ 已复制到剪贴板';
      shareCopyHint.className = 'ok';
      setTimeout(function () { shareCopyHint.textContent = ''; shareCopyHint.className = ''; }, 2200);
    }
    function fail() {
      try { shareUrlEl.focus(); shareUrlEl.select(); document.execCommand('copy'); done(); }
      catch (e) { shareCopyHint.textContent = '请手动选中复制'; shareCopyHint.className = 'warn'; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else fail();
  }

  document.getElementById('shareBtn').addEventListener('click', openShareModal);
  document.getElementById('shareClose').addEventListener('click', closeShareModal);
  document.getElementById('shareDone').addEventListener('click', closeShareModal);
  document.getElementById('shareCopy').addEventListener('click', copyShareUrl);
  shareModal.addEventListener('click', function (ev) { if (ev.target === shareModal) closeShareModal(); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && shareModal.classList.contains('open')) closeShareModal();
  });
  document.getElementById('sharedBannerClose').addEventListener('click', function () {
    document.getElementById('sharedBanner').classList.remove('show');
  });

  document.getElementById('projectSelect').addEventListener('change', function () {
    switchProject(this.value);
  });
  document.getElementById('newProjectBtn').addEventListener('click', createNewProject);
  document.getElementById('renameProjectBtn').addEventListener('click', renameCurrentProject);
  document.getElementById('deleteProjectBtn').addEventListener('click', deleteCurrentProject);
  document.getElementById('exportHtmlBtn').addEventListener('click', function () {
    if (!state) return;
    if (!window.confirm('将当前项目「' + (state.name || '未命名') + '」导出为独立 HTML 文件？\n\n导出的文件可直接双击打开，无需联网，数据已内嵌。')) return;
    exportAsHtml();
  });
  document.getElementById('backupBtn').addEventListener('click', exportBackup);
  document.getElementById('restoreBtn').addEventListener('click', importBackupClick);
  document.getElementById('importFile').addEventListener('change', onImportFile);

  var filterEl = document.getElementById('riskFilter');
  filterEl.addEventListener('change', function () {
    riskFilter = filterEl.value;
    filterEl.classList.toggle('has-filter', riskFilter !== 'all');
    renderGantt();
  });

  document.getElementById('dpHead').addEventListener('click', function (ev) {
    if (ev.target && ev.target.classList && ev.target.classList.contains('dp-toggle')) return;
    setCollapsed(!collapsed);
  });
  document.getElementById('dpToggle').addEventListener('click', function (ev) {
    ev.stopPropagation();
    setCollapsed(!collapsed);
  });

  document.getElementById('detailPanel').addEventListener('click', function (ev) {
    var pItem = findParentByClass(ev.target, 'dp-prog-item');
    if (pItem && pItem.dataset.target) { scrollToTask(pItem.dataset.target); return; }
    var rItem = findParentByClass(ev.target, 'dp-risk-item');
    if (rItem && rItem.dataset.target) { scrollToTask(rItem.dataset.target); return; }
  });

  var editBtn = document.getElementById('editBtn');
  var copyBtn = document.getElementById('copyBtn');
  var copyBtn2 = document.getElementById('copyBtn2');
  var editorEl = document.getElementById('editor');

  editBtn.addEventListener('click', function () {
    if (isReadonly) { flashSaved('只读模式，请先点击「复制为我的项目」'); return; }
    var open = editorEl.classList.toggle('open');
    editBtn.classList.toggle('on', open);
    editBtn.textContent = open ? '✓ 收起编辑面板' : '✏️ 编辑项目';
  });
  copyBtn.addEventListener('click', copyAsMine);
  copyBtn2.addEventListener('click', copyAsMine);

  editorEl.addEventListener('input', onEditorInput);
  editorEl.addEventListener('change', onEditorChange);
  editorEl.addEventListener('click', onEditorClick);

  var lastSig = '';
  function signature() {
    if (!state) return '';
    var today0 = toDay(new Date());
    var parts = state.tasks.map(function (t) { return getStatus(t.start, t.end, today0); });
    return parts.join('|') + '#' + today0.getTime() + '#' + state.tasks.length + '#' + (state.id || '');
  }
  function tick() {
    var sig = signature();
    if (sig !== lastSig) { lastSig = sig; renderGantt(); }
  }

  var hadShare = false, hadShareError = false;
  try {
    var shareFound = extractShareParam();
    if (shareFound) {
      if (shareFound.readonly) {
        hadShare = tryLoadShared(shareFound);
        if (hadShare) isReadonly = true;
        else hadShareError = true;
      } else {
        hadShare = tryLoadShared(shareFound);
        if (!hadShare) hadShareError = true;
      }
    }
  } catch (e) { hadShareError = true; }

  normalize();
  renderProjectSelect();
  renderEditor();
  renderGantt();
  setCollapsed(collapsed);
  updateReadonlyUI();

  if (hadShare && isReadonly) {
    var banner = document.getElementById('sharedBanner');
    banner.classList.add('show');
    document.getElementById('sharedBannerText').innerHTML =
      '🔒 <b>已加载只读分享的项目</b>。这是发布者的最新版本，你可以查看，但无法修改。如需编辑，请点击上方的「复制为我的项目」。';
  } else if (hadShare) {
    var banner2 = document.getElementById('sharedBanner');
    banner2.classList.add('show');
    document.getElementById('sharedBannerText').innerHTML =
      '🔗 <b>已加载分享的项目</b>，已作为新项目加入你的列表。';
  } else if (hadShareError) {
    var banner3 = document.getElementById('sharedBanner');
    banner3.classList.add('show');
    banner3.classList.add('error');
    document.getElementById('sharedBannerText').innerHTML =
      '⚠️ <b>分享链接解析失败</b>，可能链接被截断或修改了。';
  }

  lastSig = signature();
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
})();
</script>
</body>
</html>
